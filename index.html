<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ネコと和解せよ 〜猫が来るまでの7日間〜</title>
  <meta name="description" content="膝に乗ってくれるまで、7日間。ネコのサインを読みとって、少しずつ仲良くなって、ネコと和解せよ。すぐに遊べるブラウザゲーム。">
  <!-- リンクを貼ったときに出る情報。URL は src/data/params.js の SHARE.url と同じにする。絵は tools/ogp で書き出す -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ネコと和解せよ">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="ネコと和解せよ 〜猫が来るまでの7日間〜">
  <meta property="og:description" content="膝に乗ってくれるまで、7日間。ネコのサインを読みとって、少しずつ仲良くなって、ネコと和解せよ。すぐに遊べるブラウザゲーム。">
  <meta property="og:url" content="https://sakuichi.github.io/neko-wakai/">
  <meta property="og:image" content="https://sakuichi.github.io/neko-wakai/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="こちらを見ている茶トラの猫と、題名「ネコと和解せよ」">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <canvas id="stage"></canvas>
    <div id="hud" hidden>
      <div class="hud-top">
        <span id="hud-day"></span>
        <div class="hud-timer"><div id="hud-timer-bar"></div></div>
        <button id="sound-btn" type="button"></button>
      </div>
      <button id="blink-btn" type="button" hidden>まばたき<small>長押し</small></button>
    </div>
    <div id="bubble" aria-live="polite"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="screen"></div>
    <button id="bgm-btn" type="button"><span class="bgm-icon" aria-hidden="true">♪</span><span class="bgm-track"><span id="bgm-title"></span></span></button>
    <div id="overlay" hidden></div>
    <!-- 一時停止（昼と夜の画面だけで出す。src/ui/pauseMenu.js） -->
    <button id="pause-btn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></svg></button>
    <div id="pause" hidden></div>
  </div>
  <aside id="debug"></aside>
  <!-- src/ から npm run build で生成。ダブルクリック（file://）でも動くよう通常スクリプトにしている -->
  <script src="game.js"></script>
</body>
</html>
