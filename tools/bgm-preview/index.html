<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGM試聴</title>
<style>
  :root {
    --bg: #fff6e9;
    --card: #fffdf8;
    --ink: #5a3a22;
    --sub: #8a6a50;
    --accent: #e0894a;
    --line: #ecd9c2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", sans-serif;
    line-height: 1.6;
    word-break: auto-phrase;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 20px; }
  .controls {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px; margin-bottom: 16px;
  }
  .controls label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
  .controls input { flex: 1; accent-color: var(--accent); }
  #stop {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 16px; font: inherit; cursor: pointer;
  }
  #songs { display: grid; gap: 12px; }
  .song {
    display: grid; grid-template-columns: 40px 1fr 56px; align-items: center; gap: 12px;
    background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px;
    transition: border-color .2s, box-shadow .2s;
  }
  .song.on { border-color: var(--accent); box-shadow: 0 4px 14px rgba(224, 137, 74, .25); }
  .no {
    width: 36px; height: 36px; border-radius: 50%; background: var(--line);
    display: grid; place-items: center; font-weight: bold;
  }
  .song.on .no { background: var(--accent); color: #fff; }
  .song h2 { font-size: 1.15rem; margin: 0; }
  .song p { margin: 2px 0 0; }
  .mood { font-size: .95rem; }
  .meta, .pos { font-size: .8rem; color: var(--sub); }
  .meta { white-space: pre-line; }
  .pos:empty { display: none; }
  .play {
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 1.3rem;
  }
  .play:focus-visible, #stop:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .note { margin-top: 24px; font-size: .85rem; color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>BGM試聴</h1>
  <p class="lead">「ネコと和解せよ」のBGM候補です。どれも音声ファイルを使わず、ブラウザの中で合成して鳴らしています。</p>
  <div class="controls">
    <label>音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.6"></label>
    <button id="stop" type="button">すべて停止</button>
  </div>
  <div id="songs"></div>
  <p class="note">再生中にもう一度押すと止まります。曲はくり返し再生されます。気に入った曲と、使いたい場面（タイトル・昼・夜・エンディング）を番号で教えてください。</p>
</main>
<script src="preview.bundle.js"></script>
</body>
</html>
